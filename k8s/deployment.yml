apiVersion: apps/v1
kind: Deployment
metadata:
  name: tareas-app
  labels:
    app: tareas-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tareas-app
  template:
    metadata:
      labels:
        app: tareas-app
    spec:
      containers:
        - name: tareas-app
          image: mathiasvera12/tareas-app:1.0.0
          ports:
            - containerPort: 5000
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 10